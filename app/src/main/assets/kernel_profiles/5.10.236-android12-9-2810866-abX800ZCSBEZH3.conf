# GhostLock kernel profile: Samsung Galaxy Tab S8+ (SM-X800 / gts8p, SM8450 waipio)
# Kernel 5.10.236-android12-9-2810866-abX800ZCSBEZH3, Android 16 (X800ZCSBEZH3 / CHN)
#
# 数据来源（全部取自本机固件 SM-X800_5_20260819200011_18tsucmp3k_fac.zip.enc4 的
# boot.img / uefi.elf，未使用相邻内核族的猜测值）：
#   * symbol 偏移：从 boot.img 内嵌 kallsyms 恢复（112088 个符号）。
#   * kernel_phys_load：同一固件 BL 分区里的 uefi.elf 平台内存图（0xA8000000）。
#   * task_struct / cred 偏移：在镜像的 init_task / init_cred 数据上逐项核对，
#     并用反汇编交叉验证（commit_creds、__set_task_comm、task_blocks_on_rt_mutex、
#     __secure_computing、mm_init）。详见提交说明。
#   * cred.refN_image：init_cred 内的 user / user_ns / group_info 绝对地址。
#
# 路由选择（本内核 CONFIG_DEBUG_INFO_BTF=n，镜像无 BTF，几何只能靠反汇编推导）：
#   * select_stack：futex waiter 位于 fd_set 缓冲区上方 4 个 qword，可写窗口最多 3 个，
#     task/lock 落不进用户可控字，ghostlock-extract 判定不可行。
#   * multicast_waiter：推导出的 waiter_off=0x130，但内核 do_mcast_group_source 只把
#     sizeof(struct group_source_req)=0x108 字节 copy 进栈上 greqs，假 waiter 写不到，
#     该分支在本镜像上不成立。
#   * tcp_zerocopy：几何只有 compact_waiter（waiter 布局标记），与实测 rt_mutex_waiter
#     布局一致（task@0x30、lock@0x38 相邻），故选它。
# 以上仍是候选结论，必须真机复测后再标记为已支持。
